# LIL staff
halle-burns:
  name: Halle Burns
  sort_name: Burns
  role: Product and Research Manager
  bio: >
    Halle comes to LIL from librarianship, with extensive experience in data and
    project management, curation, and instructional design. She has a passion for
    digital preservation, accessibility, and federal data rescue. Outside of work,
    she can be found petting dogs, experimenting with new crafts and hobbies,
    or reading a new graphic novel.
  email: hburns@law.harvard.edu
  image: halle-burns.jpg
  affiliated: true
  current: true
  section: Staff
rebecca-cremona:
  name: Rebecca Cremona
  sort_name: Cremona
  role: Senior Software Engineer
  bio: >
    Becky was a student of physics and religion before becoming a faculty
    assistant in the Harvard SEAS Artificial Intelligence group. She moved on to
    support Harvard's open-access policies at the Office for Scholarly
    Communication, where she got the bug for web development. She now spends
    most of her time working on Perma.cc, advocating for web accessibility, and
    assisting with other LIL projects.
  email: rcremona@law.harvard.edu
  website:
  twitter_account_name: RebeccaCremona
  github_account_name: rebeccacremona
  image: rebecca-cremona.jpg
  affiliated: true
  current: true
  section: Staff
jack-cushman:
  name: Jack Cushman
  sort_name: Cushman
  role: Director
  bio: >
    Jack worked as an appellate litigator before coming to write code at LIL.
    His proudest case was [Finch v. Commonwealth](https://cite.case.law/mass/461/232/),
    which returned health insurance coverage to tens of thousands of Massachusetts immigrants
    — and now lives on at case.law, the American caselaw database Jack helps to run.
    Jack has served as a board member of the ACLU of Massachusetts and as a fellow of the Berkman
    Klein Center for Internet and Society. He also teaches the Programming for Lawyers course
    at Harvard Law School.
  email: jcushman@law.harvard.edu
  twitter_account_name:
  github_account_name: jcushman
  image: jack-cushman.jpg
  affiliated: true
  current: true
  section: Staff
michael-durkin:
  name: Michael Durkin
  sort_name: Durkin
  role: Senior Software Engineer
  bio: >
    Mike is a programmer who began his career supporting research initiatives at
    Harvard Medical School, developing tools and managing systems that enabled
    collaboration across campus. Since then, his work has encompassed embedded systems,
    network programming, and audio software development. At LIL, he uses emerging
    technologies to build tools that are transforming the landscape of legal research.
    Outside of work, Mike enjoys filmmaking and exploring different cuisines in NYC.
  email: mdurkin@law.harvard.edu
  image: michael-durkin.jpg
  affiliated: true
  current: true
  section: Staff
harmony-eidolon:
  name: Harmony Eidolon
  sort_name: Eidolon
  role: Program Coordinator
  bio: >
    Harmony joins LIL with 20+ years of project and event management experience. While navigating
    emerging city and state laws, she helped pioneer the mobile cocktail industry while
    engaging local farms and sustainable practices. Harmony has worked closely with galleries,
    non-profits, and human rights organizations in cultivating events for great causes
    including LGBTQIA++ and civil rights, food and housing justice, youth safety, environmental
    and peace initiatives, reproductive freedom, deafness/communication disorder research and
    (not least) the arts. This passion for human rights has led her to LIL, where she
    enthusiastically supports efforts to advance and democratize open knowledge.
  email: heidolon@law.harvard.edu
  image: harmony-eidolon.jpg
  affiliated: true
  current: true
  section: Staff
jenevieve-haggard:
  name: Jenevieve Haggard
  sort_name: Haggard
  role: Principal Software Engineer
  bio: >
    Jenny combines engineering expertise with legal practice to advance access to
    justice initiatives. She has worked on cutting-edge renewable energy projects
    for DARPA, DOE, and Sandia National Labs. In her legal practice, Jenny has provided
    representation in domestic violence, family law, and consumer credit cases, actively
    engaging with the Florida Access to Justice Commission. As co-founder of SavvySuit,
    she contributed to multiple mechanical patents, developed AI/ML products, and created
    a pro bono SaaS platform that connects volunteer attorneys with vulnerable clients. 
  email: jhaggard@law.harvard.edu
  image: jenevieve-haggard.jpg
  affiliated: true
  current: true
  section: Staff
molly-hardy:
  name: Molly Hardy
  sort_name: Hardy
  role: Project Lead for Public Data
  bio: >
    Molly has worked on both sides of the library reference desk for over twenty
    years. While earning her PhD in book history, she cut her teeth in special
    collections at UT Austin's Harry Ransom Center. After researching and working
    at national and local libraries, she managed the program that produces
    Chronicling America for the National Endowment for the Humanities. She has a
    passion for radical preservation of data, collections, and land. In the summer,
    she can be found in community gardens, working with free plants; in the winter,
    she can be found in front of a sewing machine, piecing together unconventional
    fabrics.
  email: mhardy@law.harvard.edu
  image: molly-hardy.jpg
  affiliated: true
  current: true
  section: Staff
shaban-mohammedsaani-hassan:
  name: Shaban Mohammedsaani Hassan
  sort_name: Hassan
  role: Senior DevOps Engineer
  bio: >
    Shaban Mohammedsaani brings extensive experience in cybersecurity and system
    architecture to LIL's infrastructure initiatives. Before joining the team, he
    founded Bitsy, a comprehensive URL management and link-in-bio platform that
    addressed gaps in existing shortening and bio services. His background spans
    telecommunications infrastructure at MTN Ghana, where he worked as an IMS engineer
    on services like VoLTE/VoBB/VoWi-Fi. At LIL, he aims to design and implement
    automated deployment pipelines, manage infrastructure, and ensure system reliability.
  email: smhassan@law.harvard.edu
  image: shaban-mohammedsaani-hassan.jpg
  affiliated: true
  current: true
  section: Staff
kristi-mukk:
  name: Kristi Mukk
  sort_name: Mukk
  role: Product and Research Manager
  bio: >
    Kristi is a librarian and learning designer who is passionate about exploring how
    technology can transform our relationship with knowledge and spark learning. At LIL,
    she works on "librarianship of AI" research and engages with Perma.cc users to shape
    product development. When she's not musing about digital futures or advocating for
    the humanities, Kristi can be found crafting her way through a growing list of
    creative projects.
  email: kmukk@law.harvard.edu
  website:
  twitter_account_name:
  github_account_name:
  image: kristi-mukk.jpg
  affiliated: true
  current: true
  section: Staff
mirabella-pisani:
  name: Mirabella Pisani
  sort_name: Pisani
  role: User Support Coordinator
  bio: >
    Bella joins LIL as a traveling jester and amateur sleuth, juggling requests and
    investigating issues for Perma users. Before LIL, they worked in nonprofit arts
    and academia coordinating projects, people, and performances. Ever-curious with
    a love of learning, Bella is a student both in the classroom as an MLIS candidate
    at Simmons University, and in the world at large.
  email: mpisani@law.harvard.edu
  website:
  twitter_account_name:
  github_account_name:
  image: mirabella-pisani.jpg
  affiliated: true
  current: true
  section: Staff
jacob-rhoades:
  name: Jacob Rhoades
  sort_name: Rhoades
  role: Senior Product Designer
  bio: >
    Jacob is a seasoned graphic designer with over a decade of experience in
    branding, illustration, and UI design. His portfolio includes collaborations
    with companies in travel, tech, architecture, and wellness. When not
    immersed in design, Jacob finds joy in family life and exploring the world
    on his bike.
  email: jrhoades@law.harvard.edu
  website: https://jacobrhoades.com/
  image: jacob-rhoades.jpg
  affiliated: true
  current: true
  section: Staff
aristana-scourtas:
  name: Aristana Scourtas
  sort_name: Scourtas
  role: Product and Research Manager
  bio: >-
    Ari comes to LIL from the world of applied AI and scientific software
    engineering, where she tackled topics such as wildfire smoke detection, AI
    reproducibility, and building open-source contributor communities. She’s
    held many roles in the past, including software engineer, project manager,
    community organizer, library assistant, and research scientist, and is
    thrilled to combine all of these in her new role at LIL to create tools for
    just access to information. She is especially excited about the
    intersections of information, justice, and technology.
  email: ascourtas@law.harvard.edu
  website:
  github_account_name: ascourtas
  image: aristana-scourtas.jpg
  affiliated: true
  current: true
  section: Staff
christopher-setzer:
  name: Christopher Setzer
  sort_name: Setzer
  role: Senior Software Engineer
  bio: >
    Chris is a programmer and writer whose professional history includes
    projects with NOAA's emergency oil spill response team, the New Mexico state
    judiciary, and an effort to recover Arctic climate data from historic ships'
    logs. Prior to joining LIL, he built tools and infrastructure to help
    government organizations share open data. Outside of work, Chris enjoys
    backpacking and exploring the Pacific Northwest in the company of his mutt.
  email: csetzer@law.harvard.edu
  github_account_name: cmsetzer
  image: christopher-setzer.jpg
  affiliated: true
  current: true
  section: Staff
christian-smith:
  name: Christian Smith
  sort_name: Smith
  role: Software Engineering Manager
  bio: >-
    Christian discovered the craft of research when his open source work with
    cryptography led to academic collaboration and an engineering role at MIT.
    Years prior he witnessed the impact of technology on law as a student at
    Berklee College of Music, when dotcom era file-sharing networks disrupted
    the music industry. At LIL, he aims to empower the engineering team, help
    invent breakthrough library tools, and improve access to justice.
  email: csmith@law.harvard.edu
  github_account_name: christiansmith
  image: christian-smith.jpg
  affiliated: true
  current: true
  section: Staff
clare-stanton:
  name: Clare Stanton
  sort_name: Stanton
  role: Product and Research Director
  bio: >
    Clare's true occupation is as a milliner, creating multiple hats for herself
    everywhere she goes. She's worked in every department of a photography
    gallery, as the event coordinator/alumni liaison/substitute teacher at a
    small independent school, as the database maintainer/research
    assistant/calendar keeper for a group of innovation and management
    researchers, as the compost watchdog/vinyl cutter whisperer/side-project
    logistics manager at LIL, the outreach and communications lead for Perma.cc,
    and now LIL's Product and Research Director. She has an MLIS from Simmons
    University.
  email: cstanton@law.harvard.edu
  website:
  twitter_account_name: clare__stanton
  github_account_name:
  image: clare-stanton.jpg
  affiliated: true
  current: true
  section: Staff
ebru-yucesar:
  name: Ebru Yucesar
  sort_name: Yucesar
  role: Senior Software Engineer
  bio: >
    Ebru is a copywriter-turned-coder with a passion for flying plastic. She has
    been working in tech for over a decade, including stints in retail and
    e-commerce spaces as a coder, and in advertising agencies as a copywriter.
    Her work at LIL focuses on backend development and data engineering. Outside
    of work, Ebru enjoys playing ultimate frisbee.
  email: eyucesar@law.harvard.edu
