# Fellows and others

matteo-cargnelutti:
  name: Matteo Cargnelutti
  sort_name: Cargnelutti
  role: Fellow
  bio: >
    Matteo is a software engineer specializing in digital preservation and open
    knowledge. Currently serving as Principal Engineer at the Institutional Data
    Initiative, Matteo previously worked as a Senior Software Engineer at LIL.
    During his time at the lab, he contributed to the design and implementation
    of web archiving technologies that now power Perma.cc, and spearheaded
    technical research into how artificial intelligence is changing our
    relationship to knowledge. Through his ongoing fellowship, Matteo continues
    to contribute to LIL’s web archiving and “Librarianship of AI” research
    efforts.
  email: mcargnelutti@law.harvard.edu
  website: https://matteocargnelutti.dev
  github_account_name: matteocargnelutti
  image: matteo-cargnelutti.jpg
  affiliated: true
  current: true
  section: Affiliates
jim-cowie:
  name: Jim Cowie
  sort_name: Cowie
  role: Fellow
  bio: >-
    Jim is a data scientist and entrepreneur, and a dual fellow with the Berkman
    Klein Center for Internet & Society.  After an early career in
    DARPA-sponsored high performance computing, Jim founded Renesys, the
    Internet Intelligence Authority, and later served as Chief Scientist at
    DynDNS. His current research focuses on the Internet History Initiative, a
    noncommercial effort to preserve and curate the historical datasets that
    document the Internet’s regional evolution, making their stories accessible
    to future historians and other audiences beyond the Internet’s traditional
    technical core community.
  website: https://internethistoryinitiative.org/
  mastodon_url: https://social.secret-wg.org/@jimcowie
  image: jim-cowie.jpg
  affiliated: true
  current: true
  section: Affiliates
christopher-dick:
  name: Christopher Dick
  sort_name: Dick
  role: Fellow
  bio: >-
    Chris is a data scientist, demographer, and founder of the company Demographic
    Analytics Advisors. He began his career as a statistician and demographer at the
    United States Census Bureau as well as the United States Citizenship and Immigration
    Services. He later served as the managing director for public sector data science for
    the tech startup Civis Analytics. His current work focuses on building tools to monitor
    the federal data ecosystem at dataindex.us, telling the story of federal data at
    essentialdata.us, and building tools to enhance decision-making in the public and
    nonprofit sectors.
  image: christopher-dick.jpg
  affiliated: true
  current: true
  section: Affiliates
