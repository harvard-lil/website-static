{% capture title %}
  {% if title-tag-complete %}
    {{ title-tag-complete }}
  {% elsif title-tag %}
    {{ title-tag | append: " | Library Innovation Lab" }}
  {% elsif title %}
    {{ title | append: " | Library Innovation Lab" }}
  {% else %}
    {{ site.title }}
  {% endif %}
{% endcapture %}
 <title>{{ title | strip }}</title>
