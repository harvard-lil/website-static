{% capture description %}
  {% if type == "project" or type == "sketch" %}
      {{ what_does_it_do }}
  {% elsif description %}
    {{ description }}
  {% elsif excerpt %}
    {{ excerpt | strip_html | strip_newlines | escape_once | truncate: 160 }}
  {% else %}
    {{ site.description }}
  {% endif %}
{% endcapture %}
<meta name="description" content="{{ description | strip }}">
