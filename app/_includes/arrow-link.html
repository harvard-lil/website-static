<a
  href="{{ href | strip }}"
  target="{% if target %}{{target}}{% else %}_self{% endif %}"
  class="flex items-center gap-3 body-text {% if card_link %}card-link{% endif %}">
  {% if arrow == 'back' %}
    {% include "icon-left-arrow.html" %}
  {% endif %}
  <span class="interactive-link dark {% if reverse %}reverse{% endif %}">{{ label|strip }}</span>
  {% if arrow != 'back' %}
    {% include "icon-right-arrow.html" %}
  {% endif %}
</a>
