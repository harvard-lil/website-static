<lil-header class="block relative z-header">
  {% assign isHome = false %}
  {% if slug == "home" %}{% assign isHome = true %}{% endif %}
  {% include "hiring-banner.html", title: "Perma.cc Legal Digital Scholarship Project Manager", isHome: isHome %}
  <header class="pt-6 md:pt-9 nav-container">
    <div class="flex items-center justify-between">
      <div aria-hidden class="opacity-0 w-[40px] md:w-[56px]"></div>
      <a href="/" class="logo">
        <span class="sr-only">Home</span>
        <span aria-hidden="true">
          {% include "header-splash-logo.html" %}
        </span>
      </a>
      <button class="menu-button" aria-haspopup="menu" aria-expanded="false" aria-label="Open menu">
        <span class="menu-button__bar"></span>
        <span class="menu-button__bar"></span>
      </button>
    </div>
    {% include "nav.html" %}
  </header>
</lil-header>
