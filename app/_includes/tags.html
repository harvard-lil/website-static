{% unless tags == empty and categories == empty %}
<footer>
  {% for tag in tags %}
    <span><a href="/blog/tag/{{ tag | slugify }}">{{ tag }}</a></span>
  {% endfor %}
  {% for category in categories %}
    <span><a href="/blog/category/{{ category | slugify }}">{{ category }}</a></span>
  {% endfor %}
</footer> <!-- end article footer -->
{% endunless %}
