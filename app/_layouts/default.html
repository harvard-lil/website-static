<!DOCTYPE html>
<html lang="en" class="text-black">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include "title.html" %}
    {% include "description.html" %}
    {% include "sharing-image.html" %}
    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html',''}}">
    <link rel="icon" href="/assets/images/favicon.ico" sizes="32x32">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-favicon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/main.css?v={{ assets.hashes['main.css'] }}">
    <link rel="alternate" href="/blog/feed/index.xml" type="application/rss+xml" title="RSS Feed">
    <link rel="alternate" href="/blog/feed/atom/index.xml" type="application/atom+xml" title="Atom Feed">
    <script src="/assets/lib/gsap.min.js?v={{ assets.libs.gsap }}"></script>
    <script src="/assets/lib/Swup.umd.js?v={{ assets.libs.swup }}"></script>
    <script src="/assets/lib/swup-head-plugin.umd.js?v={{ assets.libs.swupHeadPlugin }}"></script>
    {% include "custom-css.html" %}
  </head>
  <body class="bg-white font-sans font-normal">
    {% include "header.html" %}
    <div id="swup" class="transition-main">
      <main class="{{- type }} {{ slug -}}">
        {{ content }}
      </main>
      {% include "footer.html" %}
    </div>
    <script src="/assets/javascripts/main.js?v={{ assets.hashes['main.js'] }}"></script>
    {% include "custom-scripts.html" %}
  </body>
</html>
