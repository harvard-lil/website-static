---
layout: default
---

<div class="interview-page">
    <!-- Profile Section -->
    <section class="interview-profile" style="padding-top: 120px; background: #EFEEEB;">
        <div class="container">
            <div class="profile-content" style="padding: 0 20px;">
                <div class="profile-image">
                    <img src="/generational-data-interviews/assets/{{ page.image }}" alt="{{ page.title }}" />
                </div>
                <div class="profile-info">
                    <div class="profile-header">
                        <h1 class="interviewee-name">{{ page.title | upcase }}</h1>
                        <div class="navigation-arrows">
                            <a href="#" class="nav-arrow nav-arrow--prev" id="prev-arrow">
                                <span>←</span>
                            </a>
                            <a href="#" class="nav-arrow nav-arrow--next" id="next-arrow">
                                <span>→</span>
                            </a>
                        </div>
                    </div>
                    <div class="interviewee-bio">{{ page.bio }}</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Content Section -->
    <section class="interview-content">
        <div class="container">
            <div class="content-wrapper">
                <!-- Left Sidebar -->
                <div class="interview-sidebar">
                    <div class="sidebar-section">
                        <div class="interview-date">{{ page.date | date: "%B %d, %Y" }}</div>
                        <h3>Other Interviews</h3>
                        <div class="interview-links">
                            <!-- Links will be generated by JavaScript -->
                        </div>
                    </div>
                </div>
                
                <!-- Right Column: Interview Content -->
                <div class="interview-text">
                    {{ content }}
                </div>
            </div>
        </div>
    </section>
</div>

<script src="/generational-data-interviews/main.js"></script>
