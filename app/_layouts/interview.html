---
layout: default
---
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lil.law.harvard.edu/generational-data-interviews">
    <meta property="og:title" content="Generational Data Interviews">
    <meta property="og:description" content="14 Designs for Digital Preservation in 2025.">
    <meta property="og:image" content="https://lil.law.harvard.edu/generational-data-interviews/assets/Hero-Image_01.png">

<!-- Skip Links for Accessibility -->
<div class="skip-links">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <a href="#interview-text" class="skip-link">Skip to interview text</a>
    <a href="#navigation" class="skip-link">Skip to navigation</a>
</div>

<div class="interview-page">
    <!-- Profile Section -->
    <section class="interview-page__profile" style="padding-top: 120px; background: #EFEEEB;">
        <div class="container">
            <div class="interview-page__profile-content" style="padding: 0 20px;">
                <div class="interview-page__profile-image">
                    <img src="/generational-data-interviews/assets/{{ image }}" alt="{{ title }}" />
                </div>
                <div class="interview-page__profile-info">
                    <div class="interview-page__profile-header">
                        <h1 class="interview-page__interviewee-name">{{ title | upcase }}</h1>
                        <div class="interview-page__navigation-arrows">
                            <a href="#" class="interview-page__nav-arrow" id="prev-arrow" aria-label="Go to previous interview">
                                <span aria-hidden="true">←</span>
                            </a>
                            <a href="#" class="interview-page__nav-arrow" id="next-arrow" aria-label="Go to next interview">
                                <span aria-hidden="true">→</span>
                            </a>
                        </div>
                    </div>
                    <div class="interview-page__interviewee-bio">{{ bio }}</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Content Section -->
    <section class="interview-page__content" id="main-content">
        <div class="container">
            <div class="interview-page__content-wrapper">
                <!-- Left Sidebar -->
                <div class="interview-page__sidebar" id="navigation">
                    <div class="interview-page__sidebar-section">
                        <div class="interview-page__date">{{ page.date | date: "%B %d, %Y" }}</div>
                        <h3>Other Interviews</h3>
                        <div class="interview-page__links">
                            <!-- Links will be generated by JavaScript -->
                        </div>
                    </div>
                </div>
                
                <!-- Right Column: Interview Content -->
                <div class="interview-page__text" id="interview-text">
                    {{ content }}
                    
                    <!-- Bottom Navigation -->
                    <nav class="interview-page__text-nav" aria-label="Interview navigation">
                        <div class="interview-page__text-nav-prev">
                            <a href="#" class="interview-page__nav-arrow" id="text-prev-arrow" aria-label="Go to previous interview">
                                <span aria-hidden="true">←</span>
                            </a>
                            <span class="interview-page__text-nav-name" id="text-prev-name"></span>
                        </div>
                        <div class="interview-page__text-nav-center">
                            <a href="/generational-data-interviews/" class="interview-page__text-nav-return">Return to series</a>
                        </div>
                        <div class="interview-page__text-nav-next">
                            <span class="interview-page__text-nav-name" id="text-next-name"></span>
                            <a href="#" class="interview-page__nav-arrow" id="text-next-arrow" aria-label="Go to next interview">
                                <span aria-hidden="true">→</span>
                            </a>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </section>
</div>

<script src="/generational-data-interviews/main.js"></script>
