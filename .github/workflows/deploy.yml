name: Deploy to GitHub Pages

on:
  push:
    branches: [ interview-series ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
          working-directory: app

      - name: Install Ruby dependencies
        run: |
          cd app
          gem install bundler
          cp Gemfile_pages Gemfile
          bundle install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Node dependencies
        run: |
          cd app
          npm install

      - name: Build CSS
        run: |
          cd app
          npx postcss assets/css/main.css -o assets/css/main.css

      - name: Build Jekyll site
        run: |
          cd app
          bundle exec jekyll build --config _config_pages.yml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
