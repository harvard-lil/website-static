name: Test, Build, and Deploy

on: [push, pull_request]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    # don't run on pushes to forks
    if: github.event_name == 'pull_request' || github.repository == 'harvard-lil/website-static'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('app/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Info
        run: |
          docker compose version
          docker version
          npm --version

      - name: Setup
        run: |
          npm install vnu-jar
          sudo mkdir -m 777 build
          ls bundle || sudo mkdir -m 777 bundle
          sudo mkdir -m 777 app/.jekyll-cache
          docker compose run jekyll npm install

      - name: Test and build
        run: |
          bash ./scripts/run-tests.sh
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build/
    
  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::915821419033:role/github-actions
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync build s3://$AWS_S3_BUCKET --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: '/*'