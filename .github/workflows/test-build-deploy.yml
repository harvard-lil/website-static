name: Test, Build, and Deploy

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write  # Required for OIDC
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    # Don't run on pushes to forks, or when a PR is merged/closed
    if: github.event.action != 'closed' && (github.event_name == 'pull_request' || github.repository == 'harvard-lil/website-static')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --root-dir build/ build/
          fail: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build/

  preview:
    runs-on: ubuntu-latest
    needs: test-build
    # Don't run on PRs from forks, or when a PR is merged/closed
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build/

      - name: Add preview banner and block analytics
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const repoName = `${context.repo.owner}/${context.repo.repo}`
            const repoUrl = `${context.serverUrl}/${repoName}`;

            const analyticsBlocker = `<script>(window._paq = window._paq || []).push(['requireConsent']);</script>`;
            const banner = [
              '<div style="position: relative; z-index: 101; background: #fff069; color: #121212; padding: 16px 24px; font-size: 18px; line-height: 1.4; text-align: center;">',
              'This is a temporary preview site generated for ',
              `<a href="${repoUrl}/pull/${context.issue.number}" style="color: inherit; font-weight: 500; text-decoration: underline;">${repoName}#${context.issue.number}</a>. `,
              'It is not the production LIL website.',
              '</div>',
            ].join('');

            const htmlFiles = fs.readdirSync('build', { recursive: true }).filter((file) => file.endsWith('.html'));
            let markedCount = 0;
            for (const file of htmlFiles) {
              const filePath = path.join('build', file);
              const html = fs.readFileSync(filePath, 'utf8');
              const updated = html
                .replace(/<head(\s[^>]*)?>/i, (tag) => tag + analyticsBlocker)
                .replace(/<body(\s[^>]*)?>/i, (tag) => tag + banner);
              if (updated.length === html.length + analyticsBlocker.length + banner.length) {
                markedCount++;
              } else {
                core.warning(`Missing <head> or <body> tag in ${filePath}`);
              }
              fs.writeFileSync(filePath, updated);
            }

            core.info(`Added preview banner to ${markedCount} of ${htmlFiles.length} HTML files`);
            if (markedCount === 0) {
              core.setFailed('Failed to add preview banner to any HTML files');
            }

      - name: Deploy preview to Cloudflare Pages
        uses: harvard-lil/lil-actions/cloudflare-pages-deploy@main
        with:
          project-name: lil-website-static-preview
          directory: build
          branch: pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}

      - name: Comment preview link
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- preview-comment -->';
            const url = `https://pr-${context.issue.number}.lil-website-static-preview.pages.dev`;
            const headSha = context.payload.pull_request.head.sha;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${headSha}`;
            const body = [
              marker,
              `**Preview:** ${url}`,
              '',
              `Built from [\`${headSha.slice(0, 7)}\`](${commitUrl}) ([log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  preview-cleanup:
    runs-on: ubuntu-latest
    # Don't run on PRs from forks; run only when merging/closing PR
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions: {}
    steps:
      - name: Clean up preview deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          deployments="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/lil-website-static-preview/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # Collect every ID before deleting, since deleting shifts later pages
          ids=()
          page=1
          while :; do
            response="$(curl -sS --fail-with-body -H "$auth" "$deployments?env=preview&page=$page&per_page=25")"
            mapfile -t -O "${#ids[@]}" ids < <(jq -r --arg branch "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' <<<"$response")
            total_pages="$(jq -r '.result_info.total_pages // 1' <<<"$response")"
            (( page >= total_pages )) && break
            page=$((page + 1))
          done

          # Newest deployment holds branch alias, which must be force-deleted
          for id in "${ids[@]}"; do
            curl -sS --fail-with-body -X DELETE -H "$auth" "$deployments/$id?force=true" >/dev/null
          done
          echo "Deleted ${#ids[@]} preview deployments for $BRANCH"

  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build/

      - name: Confirm cache-busting strings applied
        run: |
          grep -q 'main.css?v=' build/index.html && echo "Cache busting applied ✅" || (echo "❌ Cache busting missing" && exit 1)

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::915821419033:role/github-actions
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync build s3://$AWS_S3_BUCKET --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

      - name: Invalidate CloudFront
        uses: koki-develop/cloudfront-invalidate-action@v1.0.4
        with:
          id: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
              {
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*LIL Website deployed successfully!*"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                                    "text": "*Repo:*\n<https://github.com/${{ github.repository }}|`${{ github.repository }}`>\n*Branch:*\n<https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}|`${{ github.ref_name }}`>\n*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*View the site:* <https://lil.law.harvard.edu|https://lil.law.harvard.edu>"
                    }
                  }
                ]
              }
